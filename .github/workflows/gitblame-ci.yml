name: GitBlame Roulette CI/CD

# Pas de filtre `paths` : le Merge Gate doit toujours répondre, sinon une PR
# qui ne touche que la doc resterait bloquée si le check est rendu obligatoire.
on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  # ==========================================
  # 0. Qui a touché à quoi ? (le git blame avant le git blame)
  # ==========================================
  # changed_files de l'event PR n'est qu'un nombre : on calcule la liste nous-mêmes.
  changes:
    name: 🔍 Detect changed modules
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      ai: ${{ steps.diff.outputs.ai-service }}
      bot: ${{ steps.diff.outputs.bot }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        run: |
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          # Modifier le workflow relance tout le monde : personne n'échappe à la roulette.
          all=false
          if echo "$files" | grep -q "^\.github/workflows/"; then all=true; fi
          for dir in backend ai-service bot; do
            if [ "$all" = true ] && [ -d "$dir" ] || echo "$files" | grep -q "^$dir/"; then
              echo "$dir=true"
            else
              echo "$dir=false"
            fi >> "$GITHUB_OUTPUT"
          done
          cat "$GITHUB_OUTPUT"

  # ==========================================
  # 1. Pipeline Backend (Dev 1)
  # ==========================================
  test-backend:
    name: ⚙️ Backend (Node/TS)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter & typecheck
        run: npm run lint --if-present

      - name: Run unit tests
        run: npm test --if-present

  # ==========================================
  # 2. Pipeline Service IA & Alibis (Dev 2)
  # ==========================================
  test-ai-service:
    name: 🤖 AI Alibi Service (Python)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    defaults:
      run:
        working-directory: ./ai-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pas de cache pip : il plante si aucun requirements.txt n'existe encore.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest

      # Uniquement les erreurs fatales (syntaxe, noms indéfinis) : celles-là bloquent.
      - name: Run linting (Flake8)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run AI logic tests
        # pytest renvoie 5 quand il ne trouve aucun test : pas de tests = pas de coupable.
        run: pytest || [ $? -eq 5 ]

  # ==========================================
  # 3. Pipeline Client / Bot (Dev 3)
  # ==========================================
  test-bot-client:
    name: 💬 Bot & Client (Node/TS)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.bot == 'true'
    defaults:
      run:
        working-directory: ./bot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bot/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint --if-present

      - name: Run client tests
        run: npm test --if-present

  # ==========================================
  # 4. Garde-fou global de fusion (Merge Gate)
  # ==========================================
  # Le seul check à rendre obligatoire dans la protection de branche.
  # Un job ignoré (brique non modifiée) passe ; un échec ou une annulation bloque.
  guard-merge:
    name: 🛡️ Merge Gate Check
    needs: [changes, test-backend, test-ai-service, test-bot-client]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate status
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Résultats des briques : $results"
          case "$results" in
            *failure*|*cancelled*)
              echo "❌ Une brique a échoué. Merci de désigner un coupable avant de merger."
              exit 1 ;;
          esac
          echo "✅ Pipeline OK, la roulette est sécurisée."
